# Автопроверка наставника. Свой workflow для собственных проверок ученица создаёт в 1.3 отдельно.
name: Автопроверка

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Автопроверка заданий
        run: node --test "exercises/*/checks/*.test.mjs"
      - name: Учёт прогресса (ошибки валят, отставание — предупреждение)
        run: node scripts/progress.mjs --check
